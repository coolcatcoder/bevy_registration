[package]
name = "bevy_registration"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Run code on the app from far away."
repository = "https://github.com/coolcatcoder/bevy_registration"
readme = "README.md"
keywords = ["bevy", "inventory", "registration"]
categories = ["game-development"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.77", features = ["full"]}
quote = "1.0.37"
proc-macro2 = "1.0.86"

[dev-dependencies]
bevy = "0.16.0"